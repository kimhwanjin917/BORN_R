<template>
    <article class="priority-card">
        <header class="card-head">
            <div class="card-head__title">
                <lightning-icon
                    icon-name="standard:account"
                    size="small"
                    alternative-text="기존기업"
                ></lightning-icon>
                <span>우선순위 기존기업</span>
            </div>
            <template lwc:if={hasAccounts}>
                <span class="card-head__count">{accountCount}</span>
            </template>
        </header>

        <template lwc:if={hasAccounts}>
            <ul class="rows">
                <template for:each={accounts} for:item="acct">
                    <li
                        key={acct.Id}
                        class="row"
                        data-id={acct.Id}
                        onclick={handleOpen}
                    >
                        <span class={acct.rankClass}>{acct.rank}</span>
                        <div class="row__body">
                            <span class="row__name" title={acct.Name}>{acct.Name}</span>
                            <template lwc:if={acct.Priority_Rationale_Summary__c}>
                                <span
                                    class="row__reason"
                                    title={acct.Priority_Rationale_Summary__c}
                                >{acct.Priority_Rationale_Summary__c}</span>
                            </template>
                        </div>
                        <span class="score-pill" title="우선순위 점수">
                            {acct.Priority_Score__c}
                        </span>
                    </li>
                </template>
            </ul>
        </template>

        <template lwc:elseif={error}>
            <div class="state state_error">{error}</div>
        </template>

        <template lwc:else>
            <div class="state state_empty">우선순위 점수가 있는 기업이 없습니다.</div>
        </template>
    </article>
</template>
