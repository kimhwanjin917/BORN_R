<template>
    <lightning-card title="RP 확정 계약조건" icon-name="standard:contract">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <template lwc:if={hasError}>
                <div class="slds-text-color_error slds-var-p-vertical_small">{error}</div>
            </template>

            <template lwc:if={summary}>
                <!-- 기본 정보 -->
                <h3 class="slds-text-title_caps slds-var-m-top_small slds-var-m-bottom_x-small">기본 정보</h3>
                <dl class="slds-list_horizontal slds-wrap">
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">거래 ID</dt>
                    <dd class="slds-item_detail slds-truncate">{dealId}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">고객사</dt>
                    <dd class="slds-item_detail slds-truncate">{accountName}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">RM</dt>
                    <dd class="slds-item_detail slds-truncate">{rmName}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">담당 Contact</dt>
                    <dd class="slds-item_detail slds-truncate">{contactName}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">상품</dt>
                    <dd class="slds-item_detail slds-truncate">{productName}</dd>
                </dl>

                <!-- RP 조건 -->
                <h3 class="slds-text-title_caps slds-var-m-top_medium slds-var-m-bottom_x-small">RP 조건</h3>
                <dl class="slds-list_horizontal slds-wrap">
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">거래방향</dt>
                    <dd class="slds-item_detail slds-truncate">{dealDirection}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">최초 매매일</dt>
                    <dd class="slds-item_detail slds-truncate">{startDate}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">환매일</dt>
                    <dd class="slds-item_detail slds-truncate">{maturityDate}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">거래금액</dt>
                    <dd class="slds-item_detail slds-truncate">{amountText}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">약정수익률</dt>
                    <dd class="slds-item_detail slds-truncate">{rpYieldText}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">수익률 구조</dt>
                    <dd class="slds-item_detail slds-truncate">{yieldStructure}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">수익률 기준</dt>
                    <dd class="slds-item_detail slds-truncate">{yieldBasis}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">수수료율</dt>
                    <dd class="slds-item_detail slds-truncate">{feeRateText}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">수수료 금액</dt>
                    <dd class="slds-item_detail slds-truncate">{feeAmountText}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">담보비율</dt>
                    <dd class="slds-item_detail slds-truncate">{collateralRatioText}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">특약</dt>
                    <dd class="slds-item_detail">{specialTerms}</dd>
                </dl>

                <!-- 자동 계산 -->
                <h3 class="slds-text-title_caps slds-var-m-top_medium slds-var-m-bottom_x-small">자동 계산</h3>
                <template lwc:if={hasCalculation}>
                    <dl class="slds-list_horizontal slds-wrap">
                        <dt class="slds-item_label slds-text-color_weak slds-truncate">기간</dt>
                        <dd class="slds-item_detail slds-truncate">{daysText}</dd>
                        <dt class="slds-item_label slds-text-color_weak slds-truncate">수익금</dt>
                        <dd class="slds-item_detail slds-truncate">{netInterestText}</dd>
                        <dt class="slds-item_label slds-text-color_weak slds-truncate">세금</dt>
                        <dd class="slds-item_detail slds-truncate">{withholdingTaxText}</dd>
                        <dt class="slds-item_label slds-text-color_weak slds-truncate">환매예정금액</dt>
                        <dd class="slds-item_detail slds-truncate">{redemptionAmountText}</dd>
                    </dl>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">계산에 필요한 값이 부족합니다.</p>
                </template>

                <!-- 체결정보 -->
                <h3 class="slds-text-title_caps slds-var-m-top_medium slds-var-m-bottom_x-small">체결정보</h3>
                <dl class="slds-list_horizontal slds-wrap">
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">중도환매 조건</dt>
                    <dd class="slds-item_detail">{earlyRedemptionTerms}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">결제계좌</dt>
                    <dd class="slds-item_detail slds-truncate">{settlementAccountText}</dd>
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">계약 상태</dt>
                    <dd class="slds-item_detail slds-truncate">{status}</dd>
                </dl>
            </template>
        </div>
    </lightning-card>
</template>
