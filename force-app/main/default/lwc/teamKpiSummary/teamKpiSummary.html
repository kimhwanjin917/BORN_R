<template>
    <article class="block">
        <header class="block-head">
            <span class="block-head__no">1</span>
            <span class="block-head__title">팀 전체 KPI 현황</span>
            <span class="block-head__en">(Executive Summary)</span>
            <template lwc:if={periodLabel}>
                <span class="block-head__period">{periodLabel}</span>
            </template>
        </header>

        <template lwc:if={error}>
            <div class="state state_error">{error}</div>
        </template>

        <template lwc:else>
            <div class="tiles">
                <div class="tile">
                    <span class="tile__label">팀 목표 금액</span>
                    <span class="tile__value">{targetFeeDisplay}</span>
                </div>
                <div class="tile">
                    <span class="tile__label">팀 누적 달성 금액</span>
                    <span class="tile__value">{achievedFeeDisplay}</span>
                </div>
                <div class="tile">
                    <span class="tile__label">팀 달성률</span>
                    <span class="tile__value">{achievementDisplay}</span>
                    <div class="tile__track">
                        <div class="tile__fill tile__fill_fee" style={achievementBarStyle}></div>
                    </div>
                </div>
                <div class="tile">
                    <span class="tile__label">예상 매출</span>
                    <span class="tile__value">{expectedFeeDisplay}</span>
                </div>
                <div class="tile">
                    <span class="tile__label">진행 중 거래 수</span>
                    <span class="tile__value">{openDealDisplay}</span>
                </div>
                <div class="tile">
                    <span class="tile__label">신규 기회 수</span>
                    <span class="tile__value">{newOppDisplay}</span>
                </div>
                <div class="tile">
                    <span class="tile__label">리스크 거래 수</span>
                    <span class="tile__value tile__value_risk">{riskDealDisplay}</span>
                </div>
                <div class="tile">
                    <span class="tile__label">평균 전환율</span>
                    <span class="tile__value">{conversionDisplay}</span>
                </div>
            </div>

            <div class="split">
                <section class="panel">
                    <h3 class="panel__title">거래 단계별 파이프라인 현황</h3>
                    <template lwc:if={hasSlices}>
                        <div class="donut-wrap">
                            <svg class="donut" viewBox="0 0 40 40" aria-hidden="true">
                                <circle class="donut__track" cx="20" cy="20" r="15.9155"></circle>
                                <template for:each={donutSlices} for:item="slice">
                                    <circle
                                        key={slice.key}
                                        class="donut__slice"
                                        cx="20"
                                        cy="20"
                                        r="15.9155"
                                        stroke={slice.color}
                                        stroke-dasharray={slice.dashArray}
                                        stroke-dashoffset={slice.dashOffset}
                                    ></circle>
                                </template>
                            </svg>
                            <div class="donut__center">
                                <span class="donut__center-label">총 파이프라인</span>
                                <span class="donut__center-value">{pipelineTotalDisplay}</span>
                            </div>
                        </div>
                        <ul class="legend">
                            <template for:each={donutSlices} for:item="slice">
                                <li key={slice.key} class="legend__item">
                                    <span class="legend__swatch" style={slice.swatchStyle}></span>
                                    <span class="legend__name">{slice.stageName}</span>
                                    <span class="legend__val">{slice.percentDisplay}</span>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <div class="state state_empty">표시할 파이프라인이 없습니다.</div>
                    </template>
                </section>

                <section class="panel">
                    <h3 class="panel__title">RM 수익 TOP 5</h3>
                    <template lwc:if={hasRanking}>
                        <table class="rank">
                            <thead>
                                <tr>
                                    <th class="rank__col-no">순위</th>
                                    <th>RM명</th>
                                    <th class="rank__col-fee">실적 금액</th>
                                    <th class="rank__col-num">진행</th>
                                    <th class="rank__col-num">신규</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={rankingRows} for:item="row">
                                    <tr key={row.key}>
                                        <td class="rank__no">{row.rank}</td>
                                        <td class="rank__name">{row.rmName}</td>
                                        <td class="rank__fee">
                                            <span class="rank__fee-val">{row.achievedFeeDisplay}</span>
                                            <span class="rank__bar"><span class="rank__bar-fill" style={row.barStyle}></span></span>
                                        </td>
                                        <td class="rank__num">{row.openDeals}</td>
                                        <td class="rank__num">{row.newOpps}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template lwc:else>
                        <div class="state state_empty">표시할 RM 실적이 없습니다.</div>
                    </template>
                </section>
            </div>
        </template>
    </article>
</template>
