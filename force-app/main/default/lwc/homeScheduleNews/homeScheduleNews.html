<template>
    <div class="dashboard">
        <!-- ─── 오늘 일정 ─────────────────────────────────────── -->
        <article class="card">
            <header class="card-head">
                <div class="card-head__title">
                    <span class="card-head__icon">
                        <lightning-icon
                            icon-name="utility:event"
                            size="small"
                            variant="inverse"
                            alternative-text="오늘 일정"
                        ></lightning-icon>
                    </span>
                    <span>오늘 일정</span>
                </div>
                <template lwc:if={hasEvents}>
                    <span class="card-head__count">{events.length}</span>
                </template>
            </header>

            <template lwc:if={hasEvents}>
                <ul class="rows">
                    <template for:each={events} for:item="evt">
                        <li key={evt.Id} class="row">
                            <div class="row__body">
                                <span class="row__name" title={evt.Subject}>{evt.Subject}</span>
                                <template lwc:if={evt.relatedName}>
                                    <span class="row__reason">{evt.relatedName}</span>
                                </template>
                            </div>
                            <lightning-formatted-date-time
                                value={evt.StartDateTime}
                                hour="2-digit"
                                minute="2-digit"
                                class="row__time"
                            ></lightning-formatted-date-time>
                            <lightning-button
                                label="미팅 시작"
                                variant="brand"
                                data-what-id={evt.opportunityId}
                                onclick={handleStartMeeting}
                                disabled={evt.startDisabled}
                            ></lightning-button>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:elseif={eventsError}>
                <div class="state state_error">{eventsError}</div>
            </template>
            <template lwc:else>
                <div class="state state_empty">오늘 예정된 미팅이 없습니다.</div>
            </template>
        </article>

        <!-- ─── 만기 알림 배지 ────────────────────────────────── -->
        <article class="card">
            <header class="card-head card-head_button" onclick={toggleTaskList}>
                <div class="card-head__title">
                    <span class="card-head__icon">
                        <lightning-icon
                            icon-name="utility:clock"
                            size="small"
                            variant="inverse"
                            alternative-text="만기 알림"
                        ></lightning-icon>
                    </span>
                    <span>만기 알림</span>
                </div>
                <span class="badge" title="열린 만기 알림 건수">{taskCount}</span>
            </header>

            <template lwc:if={showTaskList}>
                <template lwc:if={hasTasks}>
                    <ul class="rows">
                        <template for:each={tasks} for:item="tsk">
                            <li key={tsk.Id} class="row row_link" data-id={tsk.Id} data-what-id={tsk.WhatId} onclick={handleOpenTask} title="클릭하면 기회 레이더에서 이 고객을 봅니다">
                                <div class="row__body">
                                    <span class="row__name" title={tsk.Subject}>{tsk.Subject}</span>
                                    <template lwc:if={tsk.What.Name}>
                                        <span class="row__reason">{tsk.What.Name}</span>
                                    </template>
                                </div>
                                <lightning-formatted-date-time
                                    value={tsk.ActivityDate}
                                    class="row__time"
                                ></lightning-formatted-date-time>
                                <lightning-icon icon-name="utility:chevronright" size="x-small" class="row__chevron" alternative-text="기회 레이더로 이동"></lightning-icon>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:elseif={tasksError}>
                    <div class="state state_error">{tasksError}</div>
                </template>
                <template lwc:else>
                    <div class="state state_empty">열린 만기 알림이 없습니다.</div>
                </template>
            </template>
        </article>

        <!-- ─── 뉴스 요약 (카드 뉴스) ───────────────────────────── -->
        <article class="card news">
            <header class="news-head">
                <span class="news-head__icon">
                    <lightning-icon
                        icon-name="utility:news"
                        size="small"
                        variant="inverse"
                        alternative-text="뉴스 요약"
                    ></lightning-icon>
                </span>
                <div class="news-head__titles">
                    <h2 class="news-head__title">뉴스 요약</h2>
                    <lightning-formatted-date-time
                        value={today}
                        year="numeric"
                        month="numeric"
                        day="numeric"
                        class="news-head__date"
                    ></lightning-formatted-date-time>
                </div>
            </header>

            <template lwc:if={hasNews}>
                <!-- 요약 통계 -->
                <div class="news-stats">
                    <div class="stat">
                        <span class="stat__icon stat__icon_blue">
                            <lightning-icon icon-name="utility:knowledge_base" size="small" variant="inverse"></lightning-icon>
                        </span>
                        <div class="stat__body">
                            <span class="stat__label">오늘의 뉴스</span>
                            <span class="stat__value">{newsCount}<em>건</em></span>
                        </div>
                    </div>
                    <div class="stat">
                        <span class="stat__icon stat__icon_green">
                            <lightning-icon icon-name="utility:company" size="small" variant="inverse"></lightning-icon>
                        </span>
                        <div class="stat__body">
                            <span class="stat__label">핵심 산업</span>
                            <span class="stat__value stat__value_sm">{topIndustry}</span>
                        </div>
                    </div>
                    <div class="stat">
                        <span class="stat__icon stat__icon_purple">
                            <lightning-icon icon-name="utility:trending" size="small" variant="inverse"></lightning-icon>
                        </span>
                        <div class="stat__body">
                            <span class="stat__label">관심 기업</span>
                            <span class="stat__value stat__value_sm">{topParty}</span>
                        </div>
                    </div>
                </div>

                <!-- 한 줄 인사이트 -->
                <template lwc:if={insight}>
                    <div class="insight">
                        <span class="insight__icon">
                            <lightning-icon icon-name="utility:touch_action" size="small" variant="inverse"></lightning-icon>
                        </span>
                        <div class="insight__body">
                            <span class="insight__label">오늘의 한 줄 인사이트</span>
                            <p class="insight__text">{insight}</p>
                        </div>
                    </div>
                </template>

                <!-- 주요 뉴스 -->
                <div class="news-main">
                    <div class="news-main__head">
                        <h3 class="news-main__title">주요 뉴스</h3>
                        <div class="seg">
                            <button type="button" class={allBtnClass} data-filter="all" onclick={handleFilter}>전체</button>
                            <button type="button" class={industryBtnClass} data-filter="industry" onclick={handleFilter}>산업군</button>
                        </div>
                    </div>

                    <template lwc:if={hasDisplayNews}>
                        <ul class="news-grid">
                            <template for:each={displayNews} for:item="signal">
                                <li key={signal.Id} class={signal.cardClass}>
                                    <a
                                        href={signal.linkUrl}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="ncard__link"
                                    >
                                        <div class="ncard__top">
                                            <span class={signal.badgeClass}>{signal.categoryLabel}</span>
                                            <template lwc:if={signal.featured}>
                                                <span class="ncard__flag">주목</span>
                                            </template>
                                        </div>
                                        <h4 class="ncard__title" title={signal.Title__c}>{signal.Title__c}</h4>
                                        <template lwc:if={signal.Summary__c}>
                                            <p class="ncard__desc" title={signal.Summary__c}>{signal.Summary__c}</p>
                                        </template>
                                        <div class="ncard__foot">
                                            <span class="ncard__date">
                                                <lightning-icon
                                                    icon-name="utility:event"
                                                    size="xx-small"
                                                    class="ncard__date-icon"
                                                ></lightning-icon>
                                                <lightning-formatted-date-time
                                                    value={signal.Signal_Date__c}
                                                ></lightning-formatted-date-time>
                                            </span>
                                            <template lwc:if={signal.linkUrl}>
                                                <lightning-icon
                                                    icon-name="utility:new_window"
                                                    size="xx-small"
                                                    alternative-text="뉴스 보기"
                                                    class="ncard__ext"
                                                ></lightning-icon>
                                            </template>
                                        </div>
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <div class="state state_empty">해당 조건의 뉴스가 없습니다.</div>
                    </template>
                </div>
            </template>
            <template lwc:elseif={newsError}>
                <div class="state state_error">{newsError}</div>
            </template>
            <template lwc:else>
                <div class="state state_empty">표시할 뉴스가 없습니다.</div>
            </template>
        </article>
    </div>

    <!-- ─── 미팅 Flow 모달 ──────────────────────────────────── -->
    <template lwc:if={showFlowModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="미팅 시작" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="닫기"
                        onclick={closeFlowModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            size="small"
                            alternative-text="닫기"
                            variant="inverse"
                        ></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">미팅 시작</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-flow
                        flow-api-name={flowApiName}
                        flow-input-variables={flowInputVariables}
                        onstatuschange={handleFlowStatusChange}
                    ></lightning-flow>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
